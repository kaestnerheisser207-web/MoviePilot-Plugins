name: Check plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - run: python -m unittest discover -s tests/v3/cloudbackupcleanup -v
      - run: python -m compileall -q plugins.v3
      - run: git diff --check
